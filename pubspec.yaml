name: ssh_restart
description: "开源 SSH 客户端，功能参照 FinalShell，支持加密的谷歌云盘备份。"
publish_to: 'none'
version: 1.0.4+5

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dartssh2: ^4.1.0
  xterm: ^4.0.0
  provider: ^6.1.5+1
  cryptography: ^2.9.0
  googleapis: ^17.0.0
  googleapis_auth: ^2.0.0
  http: ^1.6.0
  path_provider: ^2.1.5
  file_picker: ^11.0.3
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  path: ^1.9.1
  pointycastle: ^4.0.0
  fast_gbk: ^1.0.0
  window_manager: ^0.4.3
  re_editor: ^0.10.0
  re_highlight: ^0.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
